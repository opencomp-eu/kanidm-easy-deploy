---
services:
  kanidm:
    container_name: kanidm
    image: ${KANIDM_IMAGE}
    restart: unless-stopped
    volumes:
      - ${KANIDM_DATA_DIR}:/data
      - ../assets/branding/override.css:/hpkg/override.css:ro
      - ../assets/branding/background.jpg:/hpkg/img/background.jpg:ro
    networks:
      - kanidm-net

  kanidm-cli:
    container_name: kanidm_cli
    image: ${KANIDM_TOOLS_IMAGE}
    profiles: ["cli"]
    volumes:
      - ${KANIDM_DATA_DIR}/kanidm-client-config:/root/.config/kanidm:ro
      - ${KANIDM_DATA_DIR}/kanidm_tokens:/root/.cache/kanidm_tokens
    networks:
      - kanidm-net
    entrypoint: ["kanidm"]

networks:
  kanidm-net:
    name: kanidm-net
